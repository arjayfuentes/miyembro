<div class="max-w-4xl max-sm:max-w-lg mx-auto p-5">
  <form [formGroup]="memberAddressForm" autocomplete="off">
    <div class="grid sm:grid-cols-2 gap-5">
      <div class="sm:col-span-2">
        <label class="text-gray-600 text-sm mb-2 block" for="name">
          Street
        </label>
        <input
          pInputText
          id="street"
          formControlName="street"
          type="text"
          class="w-full"
          pTooltip="{{ f['street'].errors | formErrors : 'street' }}"
          tooltipStyleClass="error-tooltip"
          [tooltipDisabled]="!(f['street'].invalid && f['street'].touched)"
          [ngClass]="{
            'border-2 border-red-500':
              f['street'].invalid && f['street'].touched
          }"
        />
      </div>
      <div class="sm:col-span-2">
        <label class="text-gray-600 text-sm mb-2 block" for="city">
          City<span class="ml-2 text-red-500 font-semilbold">*</span>
        </label>
        <input
          pInputText
          id="city"
          formControlName="city"
          type="text"
          class="w-full"
          pTooltip="{{ f['city'].errors | formErrors : 'city' }}"
          tooltipStyleClass="error-tooltip"
          [tooltipDisabled]="!(f['city'].invalid && f['city'].touched)"
          [ngClass]="{
            'border-2 border-red-500': f['city'].invalid && f['city'].touched
          }"
        />
      </div>
      <div class="sm:col-span-2">
        <label class="text-gray-600 text-sm mb-2 block" for="provinceState">
          Province/State
        </label>
        <input
          pInputText
          id="provinceState"
          formControlName="provinceState"
          type="text"
          class="w-full"
          pTooltip="{{
            f['provinceState'].errors | formErrors : 'provinceState'
          }}"
          tooltipStyleClass="error-tooltip"
          [tooltipDisabled]="
            !(f['provinceState'].invalid && f['provinceState'].touched)
          "
          [ngClass]="{
            'border-2 border-red-500':
              f['provinceState'].invalid && f['provinceState'].touched
          }"
        />
      </div>
      <div class="sm:col-span-2">
        <label class="text-gray-600 text-sm mb-2 block" for="postCode">
          Post Code<span class="ml-2 text-red-500 font-semilbold">*</span>
        </label>
        <input
          pInputText
          id="postCode"
          formControlName="postCode"
          type="text"
          class="w-full"
          pTooltip="{{ f['postCode'].errors | formErrors : 'postCode' }}"
          tooltipStyleClass="error-tooltip"
          [tooltipDisabled]="!(f['postCode'].invalid && f['postCode'].touched)"
          [ngClass]="{
            'border-2 border-red-500':
              f['postCode'].invalid && f['postCode'].touched
          }"
        />
      </div>
      <div class="sm:col-span-2">
        <label class="text-gray-600 text-sm mb-2 block" for="country">
          Country<span class="ml-2 text-red-500 font-semilbold">*</span>
        </label>
        <input
          pInputText
          id="country"
          formControlName="country"
          type="text"
          class="w-full"
          pTooltip="{{ f['country'].errors | formErrors : 'country' }}"
          tooltipStyleClass="error-tooltip"
          [tooltipDisabled]="!(f['country'].invalid && f['country'].touched)"
          [ngClass]="{
            'border-2 border-red-500':
              f['country'].invalid && f['country'].touched
          }"
        />
      </div>
    </div>
  </form>
</div>
