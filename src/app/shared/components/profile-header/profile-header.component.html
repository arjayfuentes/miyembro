<div>
  <div
    class="organization-background bg-cover bg-center h-[150px] lg:h-[250px] relative"
    [ngStyle]="{
      'background-image': 'url(' + backgroundImageUrl + ')'
    }"
  >
    <div
      class="absolute top-1/2 transform -translate-y-1/2 flex items-center gap-4 w-full justify-center sm:justify-start sm:right-4 sm:w-auto organization-badge"
    >
      <p class="text-white font-bold text-4xl">{{ title }}</p>
      <p-avatar
        class="p-1 bg-[#ece9fc] text-[#2a1261] w-[100px] h-[100px] sm:w-[120px] sm:h-[120px] lg:w-[150px] lg:h-[150px] rounded-full"
        size="xlarge"
        shape="circle"
        [image]="logoUrl"
      />
    </div>
  </div>
</div>
