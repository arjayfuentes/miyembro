<app-background>
  <div class="max-w-4xl max-sm:max-w-lg mx-auto p-5 md:h-screen min-h-screen">
    <div class="text-center mb-3 sm:mb-12">
      <a href="javascript:void(0)">
        <img
          class="w-8 h-9 inline-block"
          src="assets/app-logo-2.png"
          alt="logo"
        />
        iyembro
      </a>

      <h4 class="text-gray-600 font-semibold mt-2">
        Sign up into your account
      </h4>
    </div>

    <form [formGroup]="registerForm" autocomplete="off">
      <div class="grid sm:grid-cols-2 gap-5">
        <div>
          <label class="text-gray-600 text-sm mb-2 block" for="firstName"
            >First Name<span class="ml-2 text-red-500 font-semilbold">* </span>
          </label>
          <input
            pInputText
            id="firstName"
            formControlName="firstName"
            type="text"
            class="w-full"
            pTooltip="{{ f['firstName'].errors | formErrors : 'first name' }}"
            tooltipStyleClass="error-tooltip"
            [tooltipDisabled]="
              !(f['firstName'].invalid && f['firstName'].touched)
            "
            [ngClass]="{
              'border-2 border-red-500':
                f['firstName'].invalid && f['firstName'].touched
            }"
          />
        </div>
        <div>
          <label class="text-gray-600 text-sm mb-2 block" for="lastName"
            >Last Name<span class="ml-2 text-red-500 font-semilbold">* </span>
          </label>
          <input
            pInputText
            id="lastName"
            formControlName="lastName"
            type="text"
            class="w-full"
            pTooltip="{{ f['lastName'].errors | formErrors : 'last name' }}"
            class="w-full"
            tooltipStyleClass="error-tooltip"
            [tooltipDisabled]="
              !(f['lastName'].invalid && f['lastName'].touched)
            "
            [ngClass]="{
              'border-2 border-red-500':
                f['lastName'].invalid && f['lastName'].touched
            }"
          />
        </div>
        <div>
          <label class="text-gray-600 text-sm mb-2 block" for="email1"
            >Email<span class="ml-2 text-red-500 font-semilbold">* </span>
          </label>
          <input
            pInputText
            id="email"
            formControlName="email"
            type="text"
            class="w-full"
            pTooltip="{{ f['email'].errors | formErrors : 'email' }}"
            tooltipStyleClass="error-tooltip"
            [tooltipDisabled]="!(f['email'].invalid && f['email'].touched)"
            [ngClass]="{
              'border-2 border-red-500':
                f['email'].invalid && f['email'].touched
            }"
          />
        </div>
        <div>
          <label class="text-gray-600 text-sm mb-2 block" for="phoneNumber"
            >Phone No.<span class="ml-2 text-red-500 font-semilbold">* </span>
          </label>
          <p-inputnumber
            formControlName="phoneNumber"
            mode="decimal"
            inputId="withoutgrouping"
            [styleClass]="
              f['phoneNumber'].invalid && f['phoneNumber'].touched
                ? 'border-4 border-red-500'
                : ''
            "
            [useGrouping]="false"
            pTooltip="{{
              f['phoneNumber'].errors | formErrors : 'phoneNumber'
            }}"
            tooltipStyleClass="error-tooltip"
            [tooltipDisabled]="
              !(f['phoneNumber'].invalid && f['phoneNumber'].touched)
            "
          />
        </div>
        <div>
          <label class="text-gray-600 text-sm mb-2 block" for="password"
            >Password<span class="ml-2 text-red-500 font-semilbold">* </span>
          </label>
          <p-password
            formControlName="password"
            styleClass="register-password block w-full"
            pTooltip="{{
              f['password'].errors ||
                (fgErrors | formErrorsFilter : 'passwordNotMatch')
                | formErrors : 'password'
            }}"
            tooltipStyleClass="error-tooltip"
            [tooltipDisabled]="
              !(f['password'].invalid && f['password'].touched)
            "
            [ngClass]="{
              'password-incorrect border-2 border-red-500':
                f['password'].invalid && f['password'].touched
            }"
          >
            <!-- <ng-template #header>
              <div class="font-semibold text-xm mb-4">Pick a password</div>
            </ng-template>
            <ng-template #footer>
              <p-divider />
              <ul class="pl-2 ml-2 my-0 leading-normal">
                <li>At least one lowercase</li>
                <li>At least one uppercase</li>
                <li>At least one numeric</li>
                <li>Minimum 8 characters</li>
              </ul>
            </ng-template> -->
          </p-password>
        </div>
        <div>
          <label class="text-gray-600 text-sm mb-2 block" for="confirmPassword"
            >Confirm Password<span class="ml-2 text-red-500 font-semilbold"
              >*
            </span>
          </label>
          <p-password
            [feedback]="false"
            formControlName="confirmPassword"
            styleClass="register-password block w-full"
            pTooltip="{{
              f['confirmPassword'].errors ||
                (fgErrors | formErrorsFilter : 'passwordNotMatch')
                | formErrors : 'Confirm Password'
            }}"
            tooltipStyleClass="error-tooltip"
            [tooltipDisabled]="
              !(f['confirmPassword'].invalid && f['confirmPassword'].touched)
            "
            [ngClass]="{
              'password-incorrect border-2 border-red-500':
                f['confirmPassword'].invalid && f['confirmPassword'].touched
            }"
          >
            <!-- <ng-template #header>
              <div class="font-semibold text-xm mb-4">Pick a password</div>
            </ng-template>
            <ng-template #footer>
              <p-divider />
              <ul class="pl-2 ml-2 my-0 leading-normal">
                <li>At least one lowercase</li>
                <li>At least one uppercase</li>
                <li>At least one numeric</li>
                <li>Minimum 8 characters</li>
              </ul>
            </ng-template> -->
          </p-password>
        </div>
      </div>
      <p-divider styleClass="mt-4"></p-divider>
      <h2 class="text-lg font-medium text-purple-700 mb-3">Address details</h2>
      <div class="grid sm:grid-cols-2 gap-6" formGroupName="memberAddress">
        <div>
          <label class="text-gray-600 text-sm mb-2 block" for="street"
            >Street<span class="ml-2 text-red-500 font-semilbold">* </span>
          </label>
          <input
            pInputText
            id="street"
            formControlName="street"
            type="text"
            class="w-full"
            pTooltip="{{
              getControlErrors('memberAddress', 'street')
                | formErrors : 'street'
            }}"
            tooltipStyleClass="error-tooltip"
            [tooltipDisabled]="
              !isControlInvalidAndTouched('memberAddress', 'street')
            "
            [ngClass]="{
              'border-2 border-red-500': isControlInvalidAndTouched(
                'memberAddress',
                'street'
              )
            }"
          />
        </div>
        <div>
          <label class="text-gray-600 text-sm mb-2 block" for="city"
            >City<span class="ml-2 text-red-500 font-semilbold">* </span>
          </label>
          <input
            pInputText
            id="city"
            formControlName="city"
            type="text"
            class="w-full"
            pTooltip="{{
              getControlErrors('memberAddress', 'city') | formErrors : 'city'
            }}"
            tooltipStyleClass="error-tooltip"
            [tooltipDisabled]="
              !isControlInvalidAndTouched('memberAddress', 'city')
            "
            [ngClass]="{
              'border-2 border-red-500': isControlInvalidAndTouched(
                'memberAddress',
                'city'
              )
            }"
          />
        </div>
        <div>
          <label class="text-gray-600 text-sm mb-2 block" for="provinceState"
            >Province/State<span class="ml-2 text-red-500 font-semilbold"
              >*
            </span>
          </label>
          <input
            pInputText
            id="provinceState"
            formControlName="provinceState"
            type="text"
            class="w-full"
            pTooltip="{{
              getControlErrors('memberAddress', 'provinceState')
                | formErrors : 'provinceState'
            }}"
            tooltipStyleClass="error-tooltip"
            [tooltipDisabled]="
              !isControlInvalidAndTouched('memberAddress', 'provinceState')
            "
            [ngClass]="{
              'border-2 border-red-500': isControlInvalidAndTouched(
                'memberAddress',
                'provinceState'
              )
            }"
          />
        </div>
        <div>
          <label class="text-gray-600 text-sm mb-2 block" for="region"
            >Region<span class="ml-2 text-red-500 font-semilbold">* </span>
          </label>
          <input
            pInputText
            id="region"
            formControlName="region"
            type="text"
            class="w-full"
            pTooltip="{{
              getControlErrors('memberAddress', 'region')
                | formErrors : 'region'
            }}"
            tooltipStyleClass="error-tooltip"
            [tooltipDisabled]="
              !isControlInvalidAndTouched('memberAddress', 'region')
            "
            [ngClass]="{
              'border-2 border-red-500': isControlInvalidAndTouched(
                'memberAddress',
                'region'
              )
            }"
          />
        </div>
        <div>
          <label class="text-gray-600 text-sm mb-2 block" for="country"
            >Country<span class="ml-2 text-red-500 font-semilbold">* </span>
          </label>
          <input
            pInputText
            id="country"
            formControlName="country"
            type="text"
            class="w-full"
            pTooltip="{{
              getControlErrors('memberAddress', 'country')
                | formErrors : 'country'
            }}"
            tooltipStyleClass="error-tooltip"
            [tooltipDisabled]="
              !isControlInvalidAndTouched('memberAddress', 'country')
            "
            [ngClass]="{
              'border-2 border-red-500': isControlInvalidAndTouched(
                'memberAddress',
                'country'
              )
            }"
          />
        </div>
      </div>

      <div class="mt-2 flex justify-center">
        <p-button
          label="Sign Up"
          (click)="onClickRegister()"
          severity="help"
          styleClass="mt-4 block text-sm tracking-wider focus:outline-none"
        />
      </div>
    </form>

    <!-- <p class="text-sm text-gray-600 dark:text-gray-500">
      Already have an account?
      <a
        (click)="onClickLogin()"
        (keydown)="handleKeyDown($event)"
        class="cursor-pointer font-semilbold text-primary-800 hover:underline dark:text-primary-600"
        tabindex="0"
        >Login!</a
      >
    </p> -->
    <p class="text-sm font-light text-gray-500 dark:text-gray-400">
      Already have an account?
      <a
        (click)="onClickLogin()"
        (keydown)="handleKeyDown($event)"
        class="font-medium cursor-pointer text-primary-600 hover:underline dark:text-primary-500"
        tabindex="0"
        >Sign In</a
      >
    </p>
  </div>
</app-background>
