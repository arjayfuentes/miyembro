<div
  class="flex flex-col md:flex-row md:justify-left p-2 gap-4"
  style="position: sticky; top: 0; z-index: 10; background: white"
>
  <!-- Search by name -->
  <div class="input-wrapper">
    <input
      [(ngModel)]="name"
      pInputText
      placeholder="Search for organizations"
      class="w-full md:w-auto h-10 sm:h-6 md:h-10 p-2 sm:p-1"
    />
  </div>

  <!-- Filter -->
  <div class="flex xs:flex-row sm:flex-row gap-4">
    <div class="w-full xs:w-1/2 sm:w-1/2 md:w-56">
      <!-- Filter by country -->
      <p-select
        [options]="countries"
        [(ngModel)]="selectedCountry"
        optionLabel="label"
        optionValue="value"
        placeholder="Filter by country"
        (onChange)="getCities($event)"
        [showClear]="true"
        class="w-full"
      />
    </div>
    <div class="w-full xs:w-1/2 sm:w-1/2 md:w-56">
      <!-- Filter by city -->
      <p-select
        [options]="cities"
        [(ngModel)]="selectedCity"
        optionLabel="label"
        optionValue="value"
        placeholder="Filter by city"
        [showClear]="true"
        class="w-full"
      />
    </div>
  </div>
</div>
<app-organization-list
  [searchName]="name"
  [selectedCountry]="selectedCountry"
  [selectedCity]="selectedCity"
></app-organization-list>
