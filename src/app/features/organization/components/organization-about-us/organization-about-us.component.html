<div class="p-3 max-w-full mx-auto">
  <div
    [innerHTML]="organization?.description"
    class="w-full max-w-full break-words"
  ></div>
</div>
<p-card>
  <app-contact-details
    [showTitleHeader]="true"
    [address]="organization?.organizationAddress"
    [email]="organization?.email"
    [showEmail]="true"
    [phoneNumber]="organization?.phoneNumber"
    [websiteUrl]="organization?.websiteUrl"
    (editAddress)="goToEditOrganizationAddress()"
  ></app-contact-details>
</p-card>
